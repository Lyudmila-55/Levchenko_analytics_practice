openapi: 3.0.0
info:
  title: E-Commerce API
  version: 1.0.0
  description: API для управления товарами, заказами и пользователями
servers:
  - url: https://api.example.com/v1

tags:
  - name: products
    description: Информация о товарах
  - name: users
    description: Информация о пользователях
  - name: auth
    description: Авторизация 

paths:
  /products:
    get:
      tags:
      - products
      summary: Получить список товаров
      parameters:
        - name: category
          in: query
          description: Фильтрация по категории
          schema:
            type: string
        - name: min_price
          in: query
          description: Минимальная цена
          schema:
            type: number
        - name: max_price
          in: query
          description: Максимальная цена
          schema:
            type: number
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
           description: Неверные параметры запроса
           content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid query parameters"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
    post:
      tags:
      - products
      summary: Добавить новый товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Товар создан
        '400':
          description: Неверные данные в запросе
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request data"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"

  /products/{product_id}:
    get:
      tags:
      - products
      summary: Получить информацию о товаре
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные о товаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
           description: Неверные параметры запроса
           content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid query parameters"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
    put:
      tags:
      - products
      summary: Обновить информацию о товаре
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Товар обновлен
    delete:
      tags:
      - products
      summary: Удалить товар
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Товар удален

  /users:
    get:
      tags:
      - users
      summary: Получить список пользователей
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
           description: Неверные параметры запроса
           content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid query parameters"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
    post:
      tags:
      - users
      summary: Создать нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Пользователь создан

  /users/{user_id}:
    get:
      tags:
      - users
      summary: Получить информацию о пользователе
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags:
      - users
      summary: Обновить информацию о пользователе
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Пользователь обновлен
    delete:
      tags:
      - users
      summary: Удалить пользователя
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Пользователь удален

  /auth/registration:
    post:
      summary: Регистрация нового пользователя
      description: Регистрация нового пользователя по почте и паролю
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: "Иван Иванов"
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "password123"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: "UUID-5678"
                  name:
                    type: string
                    example: "Иван Иванов"
                  email:
                    type: string
                    example: "ivan@example.com"
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request data"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"

  /auth/authorization:
    post:
      summary: Авторизация пользователя
      description: Авторизация пользователя
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User's email
                password:
                  type: string
                  description: User's password
              required:
                - email
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token for further requests
                  refresh_token:
                    type: string
                    description: Token to refresh the access token
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request data"

  /auth/logout:
    post:
      summary: Выход пользователя из системы
      description: Выход пользователя из системы
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Токен доступа JWT не действителен
              required:
                - token
      responses:
        '200':
          description: Выход выполнен успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Result completed successfully"
        '400':
          description: Неверный токен или отсутствующий токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request data"

  /auth/forgot-password:
    post:
      summary: Запрос на сброс пароля
      description: Отправляет ссылку для сброса пароля на указанный email пользователя
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Адрес электронной почты пользователя
              required:
                - email
      responses:
        '200':
          description: Ссылка для сброса пароля отправлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ссылка для сброса пароля отправлена на вашу почту"
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request data"
        '404':
          description: Адрес электронной почты не найден в системе
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Адрес электронной почты не найден в системе"

  /auth/reset-password:
    post:
      summary: Сброс пароля
      description: Позволяет пользователю установить новый пароль, используя токен
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Токен для сброса пароля
                new_password:
                  type: string
                  description: Новый пароль пользователя
              required:
                - token
                - new_password
      responses:
        '200':
          description: Пароль успешно сброшен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Пароль успешно сброшен"
        '400':
          description: Некорректный пароль
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Неверный пароль"
                  message:
                    type: string
                    example: "Новый пароль не соответствует требованиям безопасности"
        '404':
          description: Токен не найден или срок его действия истек
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Срок действия токена истек или он не найден"
                  message:
                    type: string
                    example: "Токен для сброса пароля либо просрочен, либо недействителен"

  /auth/whoami:
    get:
      summary: Получение информации о текущем пользователе
      description: Возвращает данные о пользователе на основе переданного access token
      tags:
        - auth
      responses:
        '200':
          description: Информация о пользователе получена успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 123
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  name:
                    type: string
                    example: "Иван Иванов"
                  role:
                    type: string
                    example: "user"
        '401':
          description: Доступ запрещен (отсутствует или недействителен токен)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
                  message:
                    type: string
                    example: "Access token is missing or invalid"

  /auth/refresh-token:
    post:
      summary: Обновление access token
      description: Позволяет обновить access token, используя refresh token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh token пользователя
              required:
                - refresh_token
      responses:
        '200':
          description: Новый access token успешно выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Новый access token
                  refresh_token:
                    type: string
                    description: Новый refresh token
                  expires_in:
                    type: integer
                    example: 3600
                    description: Время жизни access token в секундах
        '401':
          description: Недействительный или истекший refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
                  message:
                    type: string
                    example: "Токен обновления недействителен или срок его действия истек"

components:
  schemas:
    Product:
      type: object
      properties:
        product_id:
          type: string
          example: "uuid-1234"
        name:
          type: string
          example: "Краска фасадная"
        description:
          type: string
          example: "Белая акриловая краска для наружных работ"
        price:
          type: number
          format: decimal
          example: 100.5
        quantity:
          type: integer
          example: 20
        category:
          type: object
          properties:
            category_id:
              type: string
              example: "uuid-5678"
            name:
              type: string
              example: "Краски и лаки"
            description:
              type: string
              example: "Краски для внутренних и наружных работ"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "UUID-1234"
        user_id:
          type: string
          example: "UUID-5678"
        name:
          type: string
          example: "Иван Иванов"
        email:
          type: string
          example: "ivan@example.com"
        phone:
          type: string
          example: "+7-900-123-45-67"
        registration_date:
          type: string
          format: date-time
          example: "2025-02-04T12:00:00Z"
        role:
          type: string
          example: "user"
        permissions:
          type: string
          example: "read" 